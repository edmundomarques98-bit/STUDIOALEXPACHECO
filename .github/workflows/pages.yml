name: Publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar site estático
        run: |
          mkdir -p _site/public _site/videos _site/evolucoes
          cp index.html site.css .nojekyll _site/
          cp public/hero-studio.webp public/favicon.svg _site/public/
          cp videos/*.mp4 _site/videos/
          cp evolucoes/*.webp _site/evolucoes/

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

# Publicação mobile responsiva
